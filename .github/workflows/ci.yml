# OmniView CI — the same four gates the local workflow enforces (OV-20).
# Constitutional law tests run here on every PR, regardless of author.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime + gate dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt black mypy flake8 types-PyYAML

      - name: black --check
        run: black --check lib core sdk intermediate tests

      - name: mypy
        run: mypy lib core sdk intermediate

      - name: flake8
        run: flake8 --max-line-length 100 lib core sdk intermediate tests

      - name: pytest
        run: python -m pytest -v
